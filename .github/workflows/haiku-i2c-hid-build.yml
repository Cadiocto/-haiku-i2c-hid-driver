name: Haiku I2C-HID driver build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/haiku-i2c-hid-build.yml'
      - 'patches/apply_i2c_hid_feature_report_fix.py'
      - 'patches/apply_touchpad_relative_mouse.py'

permissions:
  contents: read

jobs:
  build-i2c-hid:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch and workflow
        uses: actions/checkout@v4

      - name: Build against the source revision matching the laptop build
        uses: vmactions/haiku-vm@v1
        with:
          release: r1beta6
          arch: x86_64
          sync: rsync
          prepare: |
            pkgman install -y git python3.14 gcc_syslibs_devel
          run: |
            set -e
            echo '=== Haiku build environment ==='
            uname -a
            git --version
            python3.14 --version
            gcc --version
            libsupcxx=$(gcc -print-file-name=libsupc++.a)
            libsupcxx32=$(gcc -m32 -print-file-name=libsupc++.a)
            echo "GCC libsupc++: $libsupcxx"
            echo "GCC 32-bit libsupc++: $libsupcxx32"
            test "$libsupcxx" != "libsupc++.a" && test -f "$libsupcxx"
            test "$libsupcxx32" != "libsupc++.a" && test -f "$libsupcxx32"

            echo '=== Fetch the source revision matching the laptop build date ==='
            mkdir haiku-src
            cd haiku-src
            git init
            git remote add origin https://github.com/haiku/haiku.git
            git fetch --depth 1 origin 4aae8640c9b3d021cb568a514adbc1e2f48c7912
            git checkout --detach FETCH_HEAD
            actual_commit=$(git rev-parse HEAD)
            echo "Haiku source commit: $actual_commit"
            test "$actual_commit" = "4aae8640c9b3d021cb568a514adbc1e2f48c7912"

            export HAIKU_REVISION=hrev60072+631
            echo "Target Haiku revision: $HAIKU_REVISION"
            echo '=== Apply and verify the source-checked I2C-HID changes ==='
            python3.14 ../patches/apply_i2c_hid_feature_report_fix.py
            python3.14 ../patches/apply_touchpad_relative_mouse.py
            git diff --check
            git diff --stat

            echo '=== Configure x86_64 build ==='
            mkdir -p generated
            cd generated
            ../configure --target-arch x86_64

            echo '=== Pre-extract the pinned GCC syslibs package with the system package tool ==='
            package_name=gcc_syslibs_devel-13.3.0_2023_08_10-6-x86_64
            mkdir -p "download" "build_packages/$package_name"
            wget -O "download/$package_name.hpkg" "https://haiku-buildpackages.cdn.haiku-os.org/packages/$package_name.hpkg"
            /boot/system/bin/package extract -C "build_packages/$package_name" "download/$package_name.hpkg"
            test -f "build_packages/$package_name/develop/lib/libsupc++.a"
            touch "build_packages/$package_name"

            echo '=== Compile i2c_hid with the shared HID parser ==='
            jam -q i2c_hid

            echo '=== Verify build outputs ==='
            addon=$(find . -type f -name i2c_hid | head -n 1)
            if [ -z "$addon" ]; then
              echo "ERROR: i2c_hid build output was not found"
              find . -type f | grep -E 'i2c_hid' || true
              exit 1
            fi
            echo "Built i2c_hid: $addon"

            cd ..
            mkdir -p ../out
            addon=$(find generated -type f -name i2c_hid | head -n 1)
            cp "$addon" ../out/i2c_hid
            ls -lh ../out/i2c_hid

      - name: Upload compiled Haiku I2C-HID driver
        uses: actions/upload-artifact@v4
        with:
          name: haiku-i2c-hid-x86_64
          path: out/i2c_hid
          if-no-files-found: error
