name: Haiku I2C-HID driver build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/haiku-i2c-hid-build.yml'

permissions:
  contents: read

jobs:
  build-i2c-hid:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch and workflow
        uses: actions/checkout@v4

      - name: Build against the source revision matching the laptop build
        uses: vmactions/haiku-vm@v1
        with:
          release: r1beta6
          arch: x86_64
          sync: rsync
          prepare: |
            pkgman install -y git python3.14
          run: |
            set -e
            echo '=== Haiku build environment ==='
            uname -a
            git --version
            python3.14 --version
            gcc --version
            libsupcxx=$(gcc -print-file-name=libsupc++.a)
            libsupcxx32=$(gcc -m32 -print-file-name=libsupc++.a)
            echo "GCC libsupc++: $libsupcxx"
            echo "GCC 32-bit libsupc++: $libsupcxx32"
            test "$libsupcxx" != "libsupc++.a" && test -f "$libsupcxx"
            test "$libsupcxx32" != "libsupc++.a" && test -f "$libsupcxx32"

            echo '=== Fetch the source revision matching the laptop build date ==='
            mkdir haiku-src
            cd haiku-src
            git init
            git remote add origin https://github.com/haiku/haiku.git
            git fetch --depth 1 origin 4aae8640c9b3d021cb568a514adbc1e2f48c7912
            git checkout --detach FETCH_HEAD
            actual_commit=$(git rev-parse HEAD)
            echo "Haiku source commit: $actual_commit"
            test "$actual_commit" = "4aae8640c9b3d021cb568a514adbc1e2f48c7912"

            export HAIKU_REVISION=hrev60072+631
            echo "Target Haiku revision: $HAIKU_REVISION"
            echo '=== Apply and verify the source-checked I2C-HID changes ==='
            python3.14 ../patches/apply_i2c_hid_feature_report_fix.py
            git diff --check
            git diff --stat

            echo '=== Configure x86_64 build ==='
            mkdir -p generated
            cd generated
            ../configure --target-arch x86_64

            echo '=== Compile all drivers using the shared HID parser ==='
            jam -q i2c_hid usb_hid hyperv_hid

            echo '=== Verify build outputs ==='
            for name in i2c_hid usb_hid hyperv_hid; do
              addon=$(find . -type f -name "$name" | head -n 1)
              if [ -z "$addon" ]; then
                echo "ERROR: $name build output was not found"
                find . -type f | grep -E '(i2c_hid|usb_hid|hyperv_hid)' || true
                exit 1
              fi
              echo "Built $name: $addon"
            done

            cd ..
            mkdir -p ../out
            addon=$(find generated -type f -name i2c_hid | head -n 1)
            cp "$addon" ../out/i2c_hid
            ls -lh ../out/i2c_hid

      - name: Upload compiled Haiku I2C-HID driver
        uses: actions/upload-artifact@v4
        with:
          name: haiku-i2c-hid-x86_64
          path: out/i2c_hid
          if-no-files-found: error
